version: 2.1

orbs:
  yarn: artsy/yarn@5.1.3
  auto: artsy/auto@1.4.0
  auto-release: auto/release@0.2.3

jobs:
  # Pilot: canary publish via npm trusted publishing (OIDC), no npm token.
  publish-canary-oidc:
    docker:
      - image: cimg/node:22.23.4
    environment:
      AUTO_VERSION: v11.3.0
      # Overrides the npm-deploy context value, so a successful publish proves OIDC was used.
      NPM_TOKEN: not-a-real-token
    steps:
      - checkout
      - run: yarn
      - run: sudo npm install -g npm@11.20.0
      - run:
          name: Get npm OIDC token
          command: |
            echo "export NPM_ID_TOKEN=\"\$(circleci run oidc get --claims '{\"aud\": \"npm:registry.npmjs.org\"}')\"" >> "$BASH_ENV"
      - auto-release/canary

workflows:
  build_and_verify:
    jobs:
      - yarn/workflow-queue
      - yarn/update-cache:
          requires:
            - yarn/workflow-queue
      - yarn/lint:
          requires:
            - yarn/workflow-queue
      - yarn/type-check:
          requires:
            - yarn/workflow-queue
      - yarn/test:
          requires:
            - yarn/workflow-queue
      - publish-canary-oidc:
          context: npm-deploy
          filters:
            branches:
              ignore: master
          requires:
            - yarn/test
            - yarn/lint
            - yarn/type-check
            - yarn/update-cache
      - auto/publish:
          context: npm-deploy
          filters:
            branches:
              only: master
          requires:
            - yarn/test
            - yarn/lint
            - yarn/type-check
            - yarn/update-cache
